<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clients - Financial Advisor Platform</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="components/ai-chat.css">
</head>
<body>
    <div class="container">
        <!-- Navigation Bar -->
        <div class="nav-bar" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 15px 20px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; border-radius: 10px;">
            <div style="display: flex; gap: 15px;">
                <a href="index.html" style="color: white; text-decoration: none; padding: 8px 15px; border-radius: 5px; transition: background 0.2s;">🏠 Home</a>
                <a href="clients.html" style="color: white; text-decoration: none; padding: 8px 15px; border-radius: 5px; background: rgba(255, 255, 255, 0.2);">👥 Clients</a>
                <a href="calendar.html" style="color: white; text-decoration: none; padding: 8px 15px; border-radius: 5px; transition: background 0.2s;">📅 Calendar</a>
            </div>
            <div style="color: white; cursor: pointer; padding: 8px 15px; background: rgba(255, 255, 255, 0.2); border-radius: 5px;" onclick="logout()">Logout</div>
        </div>

        <!-- Header -->
        <header>
            <h1>👥 Client Management</h1>
            <p>Manage all your clients in one place</p>
        </header>

        <!-- Clients Section -->
        <section class="card">
            <div class="section-header">
                <h2>All Clients</h2>
                <div class="actions">
                    <input type="text" id="client-search" placeholder="Search by name, phone, or email..." onkeyup="searchClients()" style="width: 300px;">
                    <button onclick="showAddClientForm()">+ Add Client</button>
                </div>
            </div>

            <!-- Filters -->
            <div style="margin: 15px 0; display: flex; gap: 10px;">
                <button class="filter-btn active" onclick="filterClients('all')">All Clients</button>
                <button class="filter-btn" onclick="filterClients('recent')">Recent Contact</button>
                <button class="filter-btn" onclick="filterClients('no-contact')">No Recent Contact</button>
            </div>

            <div id="clients-list" class="data-table"></div>
        </section>
    </div>

    <!-- Add Client Modal -->
    <div id="add-client-modal" style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5);">
        <div style="background-color: white; margin: 5% auto; padding: 30px; border-radius: 10px; width: 90%; max-width: 500px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2>Add New Client</h2>
                <span style="font-size: 28px; font-weight: bold; cursor: pointer;" onclick="closeAddClientForm()">&times;</span>
            </div>

            <form id="add-client-form" onsubmit="addClient(event)">
                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: 600;">Name *</label>
                    <input type="text" id="client-name" required style="width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 5px;">
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: 600;">Phone *</label>
                    <input type="tel" id="client-phone" required pattern="[0-9]{10,15}" style="width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 5px;">
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: 600;">Email</label>
                    <input type="email" id="client-email" style="width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 5px;">
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: 600;">Address</label>
                    <textarea id="client-address" rows="3" style="width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 5px;"></textarea>
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: 600;">Notes</label>
                    <textarea id="client-notes" rows="3" style="width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 5px;"></textarea>
                </div>

                <button type="submit" style="width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 5px; font-weight: 600; cursor: pointer;">Add Client</button>
            </form>
        </div>
    </div>

    <script src="components/ai-chat.js"></script>
    <script>
        const API_BASE_URL = 'http://localhost:8000';
        let allClients = [];
        let currentFilter = 'all';

        // Check authentication
        function checkAuth() {
            const token = localStorage.getItem('access_token');
            if (!token) {
                window.location.href = 'login.html';
                return false;
            }
            return true;
        }

        function getAuthHeaders() {
            return {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${localStorage.getItem('access_token')}`
            };
        }

        // Load clients
        async function loadClients() {
            if (!checkAuth()) return;

            try {
                const response = await fetch(`${API_BASE_URL}/api/clients`, {
                    headers: getAuthHeaders()
                });

                if (response.ok) {
                    allClients = await response.json();
                    displayClients(allClients);
                } else if (response.status === 401) {
                    window.location.href = 'login.html';
                }
            } catch (error) {
                console.error('Error loading clients:', error);
            }
        }

        // Display clients
        function displayClients(clients) {
            const container = document.getElementById('clients-list');

            if (clients.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #666;">No clients found</p>';
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Phone</th>
                            <th>Email</th>
                            <th>Last Contact</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            clients.forEach(client => {
                const lastContact = client.last_contact_date || 'Never';
                html += `
                    <tr>
                        <td><strong>${client.name}</strong></td>
                        <td>${client.phone}</td>
                        <td>${client.email || '-'}</td>
                        <td>${lastContact}</td>
                        <td>
                            <button onclick="window.location.href='client-detail.html?id=${client.id}'" style="background: #667eea; color: white; border: none; padding: 5px 15px; border-radius: 3px; cursor: pointer; margin-right: 5px;">View</button>
                            <button onclick="deleteClient(${client.id})" style="background: #dc3545; color: white; border: none; padding: 5px 15px; border-radius: 3px; cursor: pointer;">Delete</button>
                        </td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            container.innerHTML = html;
        }

        // Search clients
        function searchClients() {
            const searchTerm = document.getElementById('client-search').value.toLowerCase();
            const filtered = allClients.filter(client =>
                client.name.toLowerCase().includes(searchTerm) ||
                client.phone.includes(searchTerm) ||
                (client.email && client.email.toLowerCase().includes(searchTerm))
            );
            displayClients(filtered);
        }

        // Filter clients
        function filterClients(filter) {
            currentFilter = filter;

            // Update button states
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            let filtered = allClients;

            if (filter === 'recent') {
                const thirtyDaysAgo = new Date();
                thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
                filtered = allClients.filter(c => c.last_contact_date && new Date(c.last_contact_date) >= thirtyDaysAgo);
            } else if (filter === 'no-contact') {
                const sixtyDaysAgo = new Date();
                sixtyDaysAgo.setDate(sixtyDaysAgo.getDate() - 60);
                filtered = allClients.filter(c => !c.last_contact_date || new Date(c.last_contact_date) < sixtyDaysAgo);
            }

            displayClients(filtered);
        }

        // Add client
        async function addClient(event) {
            event.preventDefault();

            const clientData = {
                name: document.getElementById('client-name').value,
                phone: document.getElementById('client-phone').value,
                email: document.getElementById('client-email').value || null,
                address: document.getElementById('client-address').value || null,
                notes: document.getElementById('client-notes').value || null
            };

            try {
                const response = await fetch(`${API_BASE_URL}/api/clients`, {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify(clientData)
                });

                if (response.ok) {
                    alert('Client added successfully!');
                    closeAddClientForm();
                    loadClients();
                } else {
                    const error = await response.json();
                    alert('Error: ' + (error.detail || 'Failed to add client'));
                }
            } catch (error) {
                console.error('Error adding client:', error);
                alert('Network error. Please try again.');
            }
        }

        // Delete client
        async function deleteClient(clientId) {
            if (!confirm('Are you sure you want to delete this client?')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/api/clients/${clientId}`, {
                    method: 'DELETE',
                    headers: getAuthHeaders()
                });

                if (response.ok) {
                    alert('Client deleted successfully!');
                    loadClients();
                } else {
                    alert('Failed to delete client');
                }
            } catch (error) {
                console.error('Error deleting client:', error);
                alert('Network error. Please try again.');
            }
        }

        // Show/hide add client form
        function showAddClientForm() {
            document.getElementById('add-client-modal').style.display = 'block';
        }

        function closeAddClientForm() {
            document.getElementById('add-client-modal').style.display = 'none';
            document.getElementById('add-client-form').reset();
        }

        function logout() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('token_expires_at');
            window.location.href = 'login.html';
        }

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            loadClients();
        });
    </script>

    <style>
        .filter-btn {
            padding: 8px 16px;
            background: #f0f0f0;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .filter-btn:hover {
            background: #e0e0e0;
        }

        .filter-btn.active:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</body>
</html>
