<app-navbar></app-navbar>

<div class="container">
  <div class="card">
    <div class="section-header">
      <div>
        <h2>Clients</h2>
        <p class="subtitle">Manage your client portfolio</p>
      </div>
      <button class="btn btn-primary" (click)="openAddModal()">+ Add Client</button>
    </div>

    <!-- Search and Filters -->
    <div class="filters-section">
      <div class="search-box">
        <input
          type="text"
          [(ngModel)]="searchTerm"
          (ngModelChange)="onSearchChange()"
          placeholder="Search by name, phone, or email..."
          class="search-input"
        />
      </div>
      <div class="filter-buttons">
        <button
          class="filter-btn"
          [class.active]="activeFilter === 'all'"
          (click)="setFilter('all')"
        >
          All Clients
        </button>
        <button
          class="filter-btn"
          [class.active]="activeFilter === 'recent'"
          (click)="setFilter('recent')"
        >
          Recent Contact (30d)
        </button>
        <button
          class="filter-btn"
          [class.active]="activeFilter === 'no-contact'"
          (click)="setFilter('no-contact')"
        >
          No Recent Contact (60d+)
        </button>
      </div>
    </div>

    <!-- Clients Table -->
    <div *ngIf="!loading">
      <table class="data-table" *ngIf="filteredClients.length > 0">
        <thead>
          <tr>
            <th>Name</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let client of filteredClients">
            <td>
              <strong>{{ client.name }}</strong>
            </td>
            <td>{{ client.phone }}</td>
            <td>{{ client.email || '-' }}</td>
            <td>
              <div class="action-buttons">
                <button
                  class="btn-small btn-primary"
                  [routerLink]="['/clients', client.id]"
                >
                  View
                </button>
                <button
                  class="btn-small btn-secondary"
                  (click)="deleteClient(client)"
                >
                  Delete
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>

      <div *ngIf="filteredClients.length === 0" class="empty-state">
        <p>No clients found</p>
        <button class="btn btn-primary" (click)="openAddModal()">Add Your First Client</button>
      </div>
    </div>

    <div *ngIf="loading" class="loading">
      Loading clients...
    </div>
  </div>
</div>

<!-- Add Client Modal -->
<div class="modal" *ngIf="showAddModal" (click)="closeAddModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>Add New Client</h3>
      <button class="close-btn" (click)="closeAddModal()">&times;</button>
    </div>

    <form (ngSubmit)="addClient()" #clientForm="ngForm">
      <div class="form-group">
        <label for="name">Name <span class="required">*</span></label>
        <input
          type="text"
          id="name"
          [(ngModel)]="newClient.name"
          name="name"
          required
          placeholder="Enter client name"
        />
      </div>

      <div class="form-group">
        <label for="phone">Phone <span class="required">*</span></label>
        <input
          type="tel"
          id="phone"
          [(ngModel)]="newClient.phone"
          name="phone"
          required
          pattern="[0-9\s\-\(\)]{10,15}"
          placeholder="Enter phone number"
        />
        <small class="help-text">10-15 digits</small>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="newClient.email"
          name="email"
          placeholder="Enter email address"
        />
      </div>

      <div class="form-group">
        <label for="address">Address</label>
        <textarea
          id="address"
          [(ngModel)]="newClient.address"
          name="address"
          rows="3"
          placeholder="Enter address"
        ></textarea>
      </div>

      <div class="form-group">
        <label for="notes">Notes</label>
        <textarea
          id="notes"
          [(ngModel)]="newClient.notes"
          name="notes"
          rows="3"
          placeholder="Any additional notes"
        ></textarea>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" (click)="closeAddModal()">
          Cancel
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="!clientForm.valid">
          Add Client
        </button>
      </div>
    </form>
  </div>
</div>
